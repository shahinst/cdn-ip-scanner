name: Build & Release

# - Pull requests touching the app or packaging: build + smoke-test every platform.
# - Tags like v2.1.0: build, then publish a GitHub Release with all archives.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'app/**'
      - 'desktop.py'
      - 'run.py'
      - 'packaging/**'
      - 'requirements*.txt'
      - 'android/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-14 }
          - { name: macos-x64,   os: macos-15-intel }
          # Oldest supported Ubuntu runners: binaries built against an older glibc run on more distros
          - { name: linux-x64,   os: ubuntu-22.04 }
          - { name: linux-arm64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
      - name: Build executable
        run: python packaging/build.py
      - name: Smoke test the built executable
        run: python packaging/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: |
            release/CDN-IP-Scanner-*.zip
            release/CDN-IP-Scanner-*.tar.gz
            release/CDN-IP-Scanner-*.sha256
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the signing keystore (release builds only)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Rename APK and write checksum
        run: |
          version="$(tr -d '[:space:]' < version)"
          mkdir -p release
          cp android/app/build/outputs/apk/release/*.apk "release/CDN-IP-Scanner-$version-android.apk"
          cd release && sha256sum "CDN-IP-Scanner-$version-android.apk" > "CDN-IP-Scanner-$version-android.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: |
            release/CDN-IP-Scanner-*.apk
            release/CDN-IP-Scanner-*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches the version file
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < version)"
          if [ "$tag" != "$file" ]; then
            echo "::error::Tag v$tag does not match version file ($file)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - name: Combine checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.apk
            dist/SHA256SUMS.txt
