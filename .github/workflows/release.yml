name: Build & Release

# - Pull requests touching the app, the npm package or the Android app: build + test everything.
# - Tags like v3.0: build, publish a GitHub Release (npm tarball + APK) and publish to npm
#   when the NPM_TOKEN secret is set.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'app/**'
      - 'node/**'
      - 'android/**'
      - 'version'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: Build (npm package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - name: Install, test and pack
        working-directory: node
        run: |
          npm ci
          npm test
          npm pack
      - name: Rename tarball and write checksum
        run: |
          version="$(tr -d '[:space:]' < version)"
          mkdir -p release
          mv node/cdn-ip-scanner-*.tgz "release/CDN-IP-Scanner-${version}-npm.tgz"
          (cd release && sha256sum "CDN-IP-Scanner-${version}-npm.tgz" > "CDN-IP-Scanner-${version}-npm.tgz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: build-npm
          path: |
            release/CDN-IP-Scanner-*.tgz
            release/CDN-IP-Scanner-*.sha256
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the signing keystore (release builds only)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Rename APK and write checksum
        run: |
          version="$(tr -d '[:space:]' < version)"
          mkdir -p release
          cp android/app/build/outputs/apk/release/*.apk "release/CDN-IP-Scanner-$version-android.apk"
          cd release && sha256sum "CDN-IP-Scanner-$version-android.apk" > "CDN-IP-Scanner-$version-android.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: |
            release/CDN-IP-Scanner-*.apk
            release/CDN-IP-Scanner-*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [npm, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches the version file
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < version)"
          if [ "$tag" != "$file" ]; then
            echo "::error::Tag v$tag does not match version file ($file)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - name: Combine checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tgz
            dist/*.apk
            dist/SHA256SUMS.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
      - name: Publish to npm (needs the NPM_TOKEN secret)
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist/CDN-IP-Scanner-*-npm.tgz --access public
