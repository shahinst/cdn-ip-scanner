name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Install Xray-core (for the real-test integration tests)
        shell: bash
        run: |
          python -c "from app.scanner.xray import install_xray; print(install_xray('ci-bin'))"
          echo "XRAY_PATH=$PWD/ci-bin/$( [ "$RUNNER_OS" = Windows ] && echo xray.exe || echo xray )" >> "$GITHUB_ENV"
      - name: Run tests
        run: python -m pytest -v

  checks:
    name: Syntax checks (JS, shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app/static/js/app.js
      - name: Check install.sh syntax
        run: bash -n install.sh

  node:
    name: npm package (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - name: Install and test
        working-directory: node
        run: |
          npm ci
          npm test
      - name: Pack and smoke-test the CLI
        working-directory: node
        shell: bash
        run: |
          npm pack
          node bin/cli.js --version

  android:
    name: Android app (compile + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
