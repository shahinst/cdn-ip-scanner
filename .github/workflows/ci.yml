name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Install Xray-core (for the real-test integration tests)
        shell: bash
        run: |
          python -c "from app.scanner.xray import install_xray; print(install_xray('ci-bin'))"
          echo "XRAY_PATH=$PWD/ci-bin/$( [ "$RUNNER_OS" = Windows ] && echo xray.exe || echo xray )" >> "$GITHUB_ENV"
      - name: Run tests
        run: python -m pytest -v

  checks:
    name: Syntax checks (JS, shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app/static/js/app.js
      - name: Check install.sh syntax
        run: bash -n install.sh
